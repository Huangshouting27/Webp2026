<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTML_table</title>
    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #ddd;
            padding: 6px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
            background-color: #04AA6D;
            color: white;
        }
        
.right {
    display: none; 
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 80%;
    background-color: white;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    border-radius: 8px;
    z-index: 1000;
    padding: 20px;
}

/* 標題樣式 */
.detail-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
    border-bottom: 2px solid #04AA6D;
    padding-bottom: 5px;
}

/* iframe 填滿容器 */
#courseFrame {
    width: 100%;
    height: calc(100% - 40px);
    border: none;
}

/* 按鈕樣式（讓它看起來不像傳統按鈕，像超連結） */
.course-btn {
    background: none;
    border: none;
    color: #04AA6D;
    text-decoration: underline;
    cursor: pointer;
    font-size: 16px;
}
.detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #04AA6D;
            margin-bottom: 10px;
            padding-bottom: 5px;
        }

/* 點擊背景關閉（選擇性加入） */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 999;
}
    </style>
</head>
<body>
    <h1>資工選課表</h1>
    <table id="csie">
        <tr>
            <th>開課單位</th>
            <th>課程名稱</th>
            <th>授課教師</th>
        </tr>
        <tr>
            <td>資工系</td>
            <td><button class="course-btn" onclick="showCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2337')">物件導向軟體設計</button></td>
            <td>黃崇源</td>
        </tr>
        <tr>
            <td>資工系</td>
            <td><button class="course-btn" onclick="showCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=61602')">計算機網路實驗</button></td>
            <td>李春良</td>
        </tr>
        <tr>
            <td>資工系</td>
            <td><button class="course-btn" onclick="showCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2338')">作業系統實務</button></td>
            <td>張哲維</td>
        </tr>
        <tr>
            <td>資工系</td>
            <td><button class="course-btn" onclick="showCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=71796')">生物統計</button></td>
            <td>陳光武</td>
        </tr>
        <tr>
            <td>資工系</td>
            <td><button class="course-btn" onclick="showCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=A2339')">通訊系統</button></td>
            <td>陳仁暉</td>
        </tr>
        <tr>
            <td>資工系</td>
            <td><button class="course-btn" onclick="showCourse('https://catalog.cgu.edu.tw/coursedata?sectionid=56665')">軟硬體專題(2)</button></td>
            <td>魏志達</td>
        </tr>
    </table>
    <button onclick="changeResult()">Change</button>

    <script>
        function changeResult() {
            var myTable = document.getElementById("csie");
            myTable.rows[1].cells[2].innerHTML = "李春良";
        }

        function showCourse(url) {
            var overlay = document.getElementById("overlay");
            var detailBox = document.querySelector(".right");
            document.getElementById("courseFrame").src = url;
            detailBox.style.display = "block";
            overlay.style.display = "block";
        }

        function closeCourse() {
            document.querySelector(".right").style.display = "none";
            document.getElementById("overlay").style.display = "none";
            document.getElementById("courseFrame").src = "";
        }   
    </script>
    <div id="overlay" onclick="closeCourse()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>

<div class="right">
    <div class="detail-header">
        <div class="detail-title">課程詳細資料</div>
        <button onclick="closeCourse()" style="cursor:pointer; color:red; font-weight:bold; border:1px solid red; background:white; padding:2px 8px;">[ 關閉 ]</button>
    </div>
    <iframe id="courseFrame" src=""></iframe>
</div>
</body>
</html>
