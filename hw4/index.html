<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>景點觀光展覽資訊 - HW4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        .search-bar { margin-bottom: 20px; max-width: 300px; }
        .table thead { background-color: #00a86b; color: white; }
        .pagination-info { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>景點觀光展覽資訊 
            <input type="text" id="searchInput" class="form-control d-inline-block search-bar" placeholder="搜尋名稱..." onchange="handleSearch()">
        </h1>

        <table id="csie" class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>名稱</th>
                    <th>地點</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>

        <div class="pagination-info">
            <button class="btn btn-outline-secondary btn-sm" onclick="prevPage()">上一頁</button>
            <span id="pageDisplay">1 / 1 頁</span>
            <button class="btn btn-outline-secondary btn-sm" onclick="nextPage()">下一頁</button>
        </div>
    </div>

    <script>
        // 全域變數
        var allData = [];      // 原始抓回的所有資料
        var filteredData = []; // 搜尋過後的資料
        var currentPage = 1;   // 目前頁碼
        const rowsPerPage = 10; // 每頁十筆

        // 1. 初始化：抓取資料
        window.onload = function() {
            var openUrl = "https://cloud.culture.tw/frontsite/trans/SearchShowAction.do?method=doFindTypeJ&category=6";
            var xhr = new XMLHttpRequest();
            xhr.open('GET', openUrl, true);
            xhr.send();

            xhr.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    allData = JSON.parse(this.responseText);
                    filteredData = allData; // 一開始過濾後的資料等於全部資料
                    updateTable();
                }
            };
        };

        // 2. 搜尋功能 (Onchange event)
        function handleSearch() {
            var keyword = document.getElementById("searchInput").value.trim();
            
            // 只呈現名稱與關鍵字相關的資料
            filteredData = allData.filter(function(item) {
                return item.title.includes(keyword);
            });

            currentPage = 1; // 搜尋後回到第一頁
            updateTable();
        }

        // 3. 更新表格內容與分頁資訊
        function updateTable() {
            var tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = ""; // 清空舊資料

            // 計算分頁
            var totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
            var startIndex = (currentPage - 1) * rowsPerPage;
            var endIndex = startIndex + rowsPerPage;
            var pageData = filteredData.slice(startIndex, endIndex);

            // 呈現目前的十筆資料
            pageData.forEach(function(data) {
                var row = tableBody.insertRow(-1);
                row.insertCell(0).innerHTML = data.title;
                row.insertCell(1).innerHTML = data.showInfo[0] ? data.showInfo[0].location : "無資訊";
            });

            // 更新頁碼顯示
            document.getElementById("pageDisplay").innerText = currentPage + " / " + totalPages + " 頁";
        }

        // 4. 分頁按鈕邏輯
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updateTable();
            }
        }

        function nextPage() {
            var totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                updateTable();
            }
        }
    </script>
</body>
</html>
